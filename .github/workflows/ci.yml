      # 倒数页那张图 ＝ 第二层上按下去的那一格（2026-10-08 方案 3-F-4：图标唯一映射 iconFor）。从前倒数页
      # 自己拼图：计时局摆一支绿脸的秒表、炸弹局摆灰底棋盘 ＋ 一颗炸弹徽记，和计时那一页、炸弹那一页按下去的
      # 那一格对不上。逐玩法从挑选层按下去（计时、无限反转、步步为营、炸弹六格、基础和布局从主菜单那张卡），
      # 量每一笔的形状和画出来的填色；老虎机那一局量的是「摆的是那台机器」。
      - name: 倒数页的图和第二层按下去的那一格是同一张
        run: |
          nohup node scripts/dev-server.mjs 8968 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8968/ && break; sleep 0.25; done
          node scripts/check-mode-icons.mjs http://localhost:8968/

      # 触屏不接 Lenis 的平滑滚动（2026-10-08 方案 3-J，玩家拍板：「移动端触摸列表一律不做 Lenis 式平滑
      # 滚动」）。从前 smoothScroll.ts 开着 syncTouch，手机上一根手指滑内容页，滚的是插值推出来的那一份；
      # 现在触屏设备一次都不建它，电脑的滚轮照旧有阻尼。手机进个人主页，<html> 上没有 lenis；电脑上有。
      - name: 触屏不接平滑滚动
        run: |
          nohup node scripts/dev-server.mjs 8967 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8967/ && break; sleep 0.25; done
          node scripts/check-smooth-touch.mjs http://localhost:8967/

      # 结算弹窗照玩家的两张设计图（2026-10-08 方案 3-I：「严格按玩家上传的设计图像素对齐」＋「横线下方……
      # overflow:hidden + touch-action:none，禁上下左右滑；内容压进固定高度，四语验收放得下」）。设计图上那一
      # 局（圆球 · 炸弹 · 430）填进真的结算弹窗，402×875 一倍像素截图，逐块扫墨的外框和图上的数比（±3px）；
      # 那张卡缩到图上的 279 宽逐块比；四种语言真打一局看结构；六种屏幕 × 四种语言装得下、键点得到；小屋
      # 那一份在的时候只有中间那一块放开滑。
      - name: 结算弹窗和设计图对得上、不滑
        run: |
          nohup node scripts/dev-server.mjs 8966 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8966/ && break; sleep 0.25; done
          node scripts/check-end-design.mjs http://localhost:8966/

      # 主菜单上开窗、关窗，轴的中线不漂（2026-10-08 方案 3-D-3：「开关 5 次中线不漂」；3-C-6：从帐号窗
      # 底下那颗 ✅ 关也不许偏）。三条来路各量一遍：轴量完位置之后招牌又长高（副标题打字机打出第一个中
      # 文字、晚到的新版本提示）；窗开着时页面被推上去（手机键盘——无头浏览器没有键盘，先垫出键盘给的那
      # 段余地再推）；登录成功那一拍重画主菜单时把被推歪的滚动位置放回去。真注册一遍（免邮箱）。
      - name: 主菜单开窗关窗中线不漂
        run: |
          nohup node scripts/dev-server.mjs 8977 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8977/ && break; sleep 0.25; done
          node scripts/check-axis-overlay.mjs http://localhost:8977/

      # 同一串种子码，每副棋盘发出同一副牌（第 19 推）：编号表二十行，每行造一串码、从《每日挑战》
      # 的输入框开两次比盘面（尺子：换一串码盘面必须不一样）；倒数那几秒页面上除了码和数字一个字
      # 都没有；存档里记着那串码；七色圆球那一天竖着拿手机先说「请横屏」。
      - name: 同一种子同一副牌
        run: |
          nohup node scripts/dev-server.mjs 8973 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8973/ && break; sleep 0.25; done
          node scripts/check-seed-deal.mjs http://localhost:8973/

      # 主菜单那张《每日挑战》（第 19 推）：七天的底图颜色读自那七个图标文件、日期字的颜色、北京
      # 23:59:59→00:00:00 准确换日（图、数字、种子同时换；钟是 page.clock 拨的）、电脑宽屏一屏放
      # 得下、首玩期间也在。
      - name: 每日挑战那张卡与北京零点换日
        run: |
          nohup node scripts/dev-server.mjs 8974 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8974/ && break; sleep 0.25; done
          node scripts/check-daily.mjs http://localhost:8974/

      # 分享卡上那一行「种子 XXXX-XXXX」（第 19 推）：在二维码说明底下、整个在明细上面（明细往下让
      # 一行、两行不叠）；每日挑战那一行更长（「· 每日 10/03」）；老档没有种子就不画。量的是导出
      # 那张 PNG 的像素。
      - name: 分享卡上的种子
        run: |
          nohup node scripts/dev-server.mjs 8975 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8975/ && break; sleep 0.25; done
          node scripts/check-share-seed.mjs http://localhost:8975/

      # 屋主关掉网页走掉，坐在小屋页上的客人按《ok》（2026-10-08 方案 2-3）：打过局的拿到那张
      # 总战绩图（和屋主按《解散》、客人自己按《离开》同一样东西），一局都没打过的回主菜单，座位
      # 照样交回去。从前这一条按完就回主菜单，在这间屋子里打过的每一局一笔勾销。一台自己的服务
      # 器：开两间屋，兑 TESTMONTH、TESTYEAR 各一次。
      - name: 屋主走掉之后客人拿到的那张总战绩图
        run: |
          nohup node scripts/dev-server.mjs 8984 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8984/ && break; sleep 0.25; done
          node scripts/check-host-gone-card.mjs http://localhost:8984/

      # localStorage 一碰就抛的环境（Chrome 关掉网站数据、一些 App 内置浏览器）里开站（2026-10-08
      # 方案 2-5）：主菜单出得来、开得了一局、个人主页打得开、一路没有没接住的错。从前 boot() 第一
      # 句 loadLang() 一抛就是一张白屏。前半节纯 node：watchRoom 的回调抛一次，轮询照样接着排。
      - name: localStorage 用不了也不白屏
        run: |
          nohup node scripts/dev-server.mjs 8986 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8986/ && break; sleep 0.25; done
          node scripts/check-no-storage.mjs http://localhost:8986/

      # 六边圆球中心那颗空心球（2026-10-08 方案 2-4 B）：画在洞位上（截图量那一圈、圈里是空的）、
      # 和旁边的球一样大、不是棋子（不挂 .ball / data-r/c）、碰不着（按在它上面拖，什么都不动；
      # 尺子：按在旁边真球上同样一拖，那一行真的滑了，滑完洞还在原地）。
      - name: 六边圆球中心那颗空心球
        run: |
          nohup node scripts/dev-server.mjs 8988 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8988/ && break; sleep 0.25; done
          node scripts/check-hex-hole.mjs http://localhost:8988/

      # 屋主等待页上那颗「不等了」（2026-10-08 方案 2-6）：客人的等待页上没有、屋主的有；按下去屋
      # 主和先交卷的人回到小屋页，挂机那一位手上那一局照旧开着（不拽人）；屋主照常开下一局。一台
      # 自己的服务器（兑一次 TESTMONTH）。
      - name: 屋主等待页上的「不等了」
        run: |
          nohup node scripts/dev-server.mjs 8992 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8992/ && break; sleep 0.25; done
          node scripts/check-room-force-ui.mjs http://localhost:8992/

      # 屋主按了《解散小屋》、服务器那头没办成（2026-10-08 方案 2-7）：留在原页、屋子不忘，那一问
      # 原样再问一次、上面多一行「小屋还没解散」，客人那头小屋照旧开着；小屋页和主菜单横幅两个入口
      # 各拦一次 end。尺子：放行之后再按一次，真的散了。一台自己的服务器（兑一次 TESTMONTH）。
      - name: 解散没办成：不忘屋，再问一次
        run: |
          nohup node scripts/dev-server.mjs 8994 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8994/ && break; sleep 0.25; done
          node scripts/check-disband-retry.mjs http://localhost:8994/

      # 榜没拉下来说「没拉下来」，不说「还没有人」（2026-10-08 方案 2-8）：记录页那块缩略图和点开
      # 之后那一整页，拉榜那一条断掉时各量一次；尺子：放行之后这台新服务器上确实没人，那时候说的
      # 才是「还没有人」。一台自己的服务器（兑一次 TESTMONTH）。
      - name: 榜没拉下来不说「还没有人」
        run: |
          nohup node scripts/dev-server.mjs 8995 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8995/ && break; sleep 0.25; done
          node scripts/check-rank-network.mjs http://localhost:8995/

      # 小屋开局前那一问「会不会」答了「会」就记下来（2026-10-08 方案 2-10）：第一局客人没看过这
      # 一族的教学，服务器多留四秒、他被问；答「会」之后本机记下「看过了」，第二局同一族服务器不
      # 再多留、也不再问他。从前每一局都这样，全屋每局多等四秒。一台自己的服务器（兑一次 TESTMONTH）。
      - name: 小屋里答「会」就记下来
        run: |
          nohup node scripts/dev-server.mjs 8996 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8996/ && break; sleep 0.25; done
          node scripts/check-room-knows.mjs http://localhost:8996/

      # 每日挑战那一局没进今日榜，结算页上说一句明话（2026-10-08 方案 2-11）：三台设备各打一局，钟
      # 对的那台不说（尺子：服务器回 stored）；钟快三天、慢三天、对不上服务器的钟（HEAD 拦掉）的那
      # 两台，服务器回 rejected / late，结算页上都要说那一句。一台自己的服务器（兑三张码）。
      - name: 每日挑战没进今日榜要说一句
        run: |
          nohup node scripts/dev-server.mjs 8997 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8997/ && break; sleep 0.25; done
          node scripts/check-daily-note.mjs http://localhost:8997/

      # 方块拖满一整圈不算一步（2026-10-08 方案 2-12）：在步步为营里量（左上那一格印的是余步）——一
      # 行、一列各拖满 6 格，余步一步不扣、那一行那一列原样；尺子：同样的手法拖一格，那一行真的变了。
      # 从前方块自己转，只拦了「没动」，拖满一圈照样记一步。一台自己的服务器（兑一次 TESTMONTH）。
      - name: 方块拖满一整圈不算一步
        run: |
          nohup node scripts/dev-server.mjs 8998 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8998/ && break; sleep 0.25; done
          node scripts/check-square-fullturn.mjs http://localhost:8998/

      # 屋主替小屋挑玩法时那条横幅，两颗键手指按得着（2026-10-08）：真手机（isMobile + hasTouch）、真
      # 手指（触摸事件），静止时量一次、把轴推一把让卡片滑进横幅那一带再量一次，再真点「小屋里」「离开
      # 小屋」；390×844 和 360×640 两块屏。从前鱼眼轴整层压在横幅上面：看得见、按不着，推过轴之后按
      # 「离开小屋」反而点进了底下那张卡。一台自己的服务器（兑一次 TESTMONTH）。
      - name: 小屋挑玩法那条横幅手指按得着
        run: |
          nohup node scripts/dev-server.mjs 8999 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8999/ && break; sleep 0.25; done
          node scripts/check-room-pick-tap.mjs http://localhost:8999/

  # 两条都绿了，才把这一版推到 production（第 20 推，见文件头）。
  #
  # · 只有「推到开发分支」的那一次跑（别的分支、PR 都不跑）。
  # · **只快进**：production 永远是开发分支上的某一个提交。
  #   - 这一版已经在 production 里了（一次更晚的推送先跑完、先推过了）——什么也不推，算过。
  #     不然一次慢的旧运行会把 production 往回拨。
  #   - production 上有开发分支没有的提交（有人手推过 production）——不推、报红，等人来看。
  #     这时候硬推（--force）等于悄悄把那几个提交从线上撤掉。
  # · 同一时间只有一个在推（concurrency）；排着队的旧运行被新的顶掉也没关系，最新那次会推。
  # · 推用的是这次运行自带的 GITHUB_TOKEN。仓库给它的默认权限可能只有读，所以这个 job 自己写
  #   明 `contents: write`（方案原话「需要 contents: write」）。
  promote:
    needs: [check, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/fangtang-game-web-app-xbecza'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 推到 production（只快进）
        run: |
          if git fetch --quiet origin production; then
            if git merge-base --is-ancestor HEAD origin/production; then
              echo "这一版已经在 production 里了，不用再推。"
              exit 0
            fi
            if ! git merge-base --is-ancestor origin/production HEAD; then
              echo "::error::production 上有开发分支没有的提交，不推。先查清楚是谁、为什么手推了 production。"
              exit 1
            fi
          else
            echo "production 还不存在：这一次新建它。"
          fi
          git push origin HEAD:refs/heads/production
