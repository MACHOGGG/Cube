# 每次推到这个分支，机器先替我们跑一遍。
#
# **两个 job，并排跑；两条都绿了，第三个 job 才把这一版推到 production。**
#
# `promote`（第 20 推）：从前「推送 = 上线」——开发分支就是 Vercel 的生产分支，推上去几十秒
# play-slides.com 就变了，CI 红不红都拦不住，它只能事后告诉你「刚上线的那一版是坏的」。现在
# Vercel 改认 `production`（玩家在后台改 Branch Tracking），而 `production` 只由 promote 推：
# check 和 browser 都过了，才把这一次提交原样快进过去。
#
# `check`：不用起浏览器、几十秒就跑完的那一批——类型、构建，加上一堆纯逻辑的检查。
# 这一条的节奏不许被拖慢：等得久的检查最后一定会被人跳过。
#
# `browser`：要装 Chromium、要起 dev-server 的那一批。从前一道都没收，全靠手跑，
# 于是「换回鱼眼轴那天起 check-menu 就一直崩着、后面 39 条一条都没跑过」这种事没人
# 发现。所以先收**最近真的拦下过回归**的那四道，跑稳了再逐批加。
# 它和 check 是**并行**的：browser 慢几分钟，不影响 check 什么时候出结果。
#
# 这件事的由来：在这之前一次自动化都没有，tsc 和这一批 check-*.mjs 全靠
# 「某次会话里有没有想起来跑一遍」。像「两个函数各自都对、放在一起却矛盾」
# 那种（死局判定按 4 枚算，而随机目标的图案只要 2 枚），人工巡检不一定看得
# 见，机器每次都看得见。
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # 类型和构建。build 自己就跑 tsc -b，所以这两步合起来既验类型也验产物。
      - name: 类型与构建
        run: npm run build

      # 小红书端的类型。上面那一步**不管它**：根 tsconfig 的 include 只有
      # ["src"]，从来不含 xhs/src，而出包那条路（build:xhs）对 TS 只是「剥掉类型
      # 直接转译」。于是小红书端这 13 个文件大量调用 src/ 的引擎，网页端改了函数
      # 签名、这边的引用点本该报错，可 CI 一个字都不会红——正是这个仓库最怕的那
      # 种「写的时候没人看得见，等玩家点开某个按钮白屏了才发现」。
      #
      # 第一次接上就抓到两个：一个从没用过的导入，和替身模块拿 RunData 拿错了地
      # 方（persistence 只是 import 它，并不导出），而替身存在的全部意义就是签名
      # 和真身一样。几百毫秒，不开浏览器，没有理由留在 CI 外面。
      - name: 小红书端的类型
        run: npx tsc -p xhs/tsconfig.json

      # 提交进仓库的小红书产物「只拼了一遍」：index.html 恰好一行 <script src="./app.js">，
      # app.js 里 Chrome 61 补丁头恰好一份——public/xhs/ 和 zip 都查。
      #
      # **排在下一步重出之前**：它量的是仓库里提交的那一份，重出之后量的就是 CI 自己刚出的了。
      # 2026-10-08 本地两道小红书的门同时起跑，各自重出预览页，两个进程往同一个 xhs/dist/
      # 写，script 补成了两行、补丁头拼了两遍，所有的门照样全绿。出包那一头现在有锁有闸
      # （xhs/ensurePreview.mjs、xhs/build.mjs），这一道兜的是「坏的那一份已经提交了」——下
      # 一步只比 public/xhs/、不比 zip，一份拼坏的 zip 从前没有任何一步会红。
      - name: 小红书产物只拼了一遍
        run: node xhs/check-bundle.mjs

      # 提交进仓库的小红书产物，必须能由当下的源码重新出一遍。
      #
      # public/xhs/ 不是构建产物目录，是**提交进仓库的成品**（网站发出去之后，真机
      # 上开 play-slides.com/xhs/ 就是这一份）。所以 src/ 改了文案而没重出包，小红
      # 书那一端就一直发着旧字，而 CI 一个字都不会红——2026-09 真出过一次：上一个
      # 提交改了 i18n，产物里少了六句（mpErrTooMany 四语言、serverBusy 英法），是
      # 外部巡检偶然看出来的。「需要有人记得」的事，交给机器每次都查。
      #
      # 只比 public/xhs/。xhs/slides-minitool.zip 不比：它的整体字节每次都不同（zip
      # 头里存了 mtime），比它会天天误报。而 public/xhs 下那五个文件是确定性的
      # ——app.js 连出三遍 sha256 一模一样，index.html 和三个字体本来就是照抄。
      - name: 小红书产物必须能由源码重现
        run: |
          npm run build:xhs
          # ⚠️ 用 `git status --porcelain`，不用 `git diff --quiet`。
          #
          # `git diff` 只看**已跟踪**的文件：产物里**新多出来一个文件**（加了一张字体、
          # 拆出一个 chunk）它一个字都不报，而那正是「产物和源码对不上」最常见的一种
          # ——漏提交一个新文件，线上那一端加载它会 404。porcelain 连未跟踪的一起报
          # （`??` 开头那几行）。
          DIRTY=$(git status --porcelain -- public/xhs)
          if [ -n "$DIRTY" ]; then
            echo "::error::public/xhs/ 和源码对不上。本地跑一次 npm run preview:xhs，把 public/xhs/ 和 xhs/slides-minitool.zip 一起提交。"
            echo "$DIRTY"
            git diff --stat -- public/xhs
            exit 1
          fi
      # zip 里装的必须和 xhs/dist 一模一样——**逐个文件比**，不比 zip 的整体字节。
      #
      # 那份 zip 是真正传进 Builder Hub 的东西，而上一步只管 public/xhs。两边是同一次构建
      # 出来的，可中间隔着「压进 zip」这一步：少打一个文件、把目录结构多包一层（解压出来
      # 是 `dist/index.html` 而不是 `index.html`，容器就打不开首页），zip 的大小看着还挺正
      # 常。整体字节比不了（zip 头里存了 mtime，每次都不同，见上一步那段），所以比的是
      # 「有哪些文件」和「每个文件的 sha256」。
      - name: zip 里装的和 dist 一模一样
        run: |
          rm -rf /tmp/zipcheck && mkdir -p /tmp/zipcheck
          unzip -q xhs/slides-minitool.zip -d /tmp/zipcheck
          ( cd xhs/dist && find . -type f | sort | xargs sha256sum ) > /tmp/dist.sha
          ( cd /tmp/zipcheck && find . -type f | sort | xargs sha256sum ) > /tmp/zip.sha
          if ! diff -u /tmp/dist.sha /tmp/zip.sha; then
            echo "::error::xhs/slides-minitool.zip 和 xhs/dist 对不上（上面是逐个文件的 sha256 差异）。"
            exit 1
          fi
          echo "zip 和 dist 逐个文件一致（$(wc -l < /tmp/dist.sha) 个文件）"

      # 纯逻辑，不碰 DOM：得分连锁、图案表与判定、死局门槛。
      - name: 计分连锁
        run: |
          npx esbuild src/engine/scoring.ts --bundle --format=esm --outfile=/tmp/scoring.mjs
          node scripts/check-scoring.mjs /tmp/scoring.mjs
      - name: 解密的步数与综合得分
        run: |
          npx esbuild src/engine/puzzleScore.ts --bundle --format=esm --outfile=/tmp/puzzle.mjs
          node scripts/check-puzzle.mjs /tmp/puzzle.mjs
      # 结算页那几行明细「加起来要对得上」。两档悄悄对不上过很久：老虎机的完成奖
      # 励（⌈枚数²/2⌉）压根没摆出来，那一截凭空消失在拼出分里；无限反转走错了分
      # 支，摆着一行「翻面 n 枚 ×2」而那个数和它的得分毫无关系。两样都不报错、不
      # 白屏，只是数字不对——而数字正是这一页唯一的内容。纯逻辑、几十毫秒。
      - name: 结算页明细加起来对得上
        run: |
          npx esbuild src/engine/runRecord.ts --bundle --format=esm --outfile=/tmp/runrecord.mjs
          node scripts/check-breakdown.mjs /tmp/runrecord.mjs
      # 英法文单复数（第 14 推）：结算页、HUD 上那几句带数字的话，1 的时候不念成复数。原
      # 先每句只有一份复数形，走了一步的人看见「1 moves」、降到 1 枚的时候冒「1 tiles」。
      - name: 英法文单复数
        run: |
          npx esbuild src/i18n.ts --bundle --format=esm --outfile=/tmp/i18n.mjs
          npx esbuild src/engine/runRecord.ts --bundle --format=esm --outfile=/tmp/runrecord.mjs
          node scripts/check-plurals.mjs /tmp/i18n.mjs /tmp/runrecord.mjs
      # 设计软件导出的 SVG 带一行 <title>编组</title>，嵌进页面就是悬停提示「编组」、读屏也念它
      # （第 14 推）。图标和天才标志两条路都在嵌进去之前统一去掉；样本是玩家给的炸弹图标原件。
      - name: 图标里的 <title> 去掉了
        run: |
          npx esbuild src/ui/svgTitle.ts --bundle --format=esm --outfile=/tmp/svgtitle.mjs
          node scripts/check-svg-title.mjs /tmp/svgtitle.mjs
      - name: 局中实时排名摆哪几行
        run: |
          npx esbuild src/engine/standingsWindow.ts --bundle --format=esm --outfile=/tmp/window.mjs
          node scripts/check-standings-window.mjs /tmp/window.mjs
      # 小屋倒数的钟（第 14 推）：偏差取往返最短那一份回包的中点，倒数数字只减不增。喂的是模
      # 拟回包（已知真偏差），每一条都带「原先那样会怎样」的尺子——原先那种写法同一组回包会
      # 估歪 850ms、会数出「4 3 2 3 2 1」。
      - name: 小屋倒数的钟
        run: |
          npx esbuild src/engine/clockSync.ts --bundle --format=esm --outfile=/tmp/clocksync.mjs
          node scripts/check-clock-sync.mjs /tmp/clocksync.mjs
      - name: 随机得分目标的图案与判定
        run: |
          npx esbuild src/engine/targets.ts --bundle --format=esm --outfile=/tmp/targets.mjs
          npx esbuild src/engine/targetMatch.ts --bundle --format=esm --outfile=/tmp/match.mjs
          node scripts/check-targets.mjs /tmp/targets.mjs /tmp/match.mjs
      - name: 死局门槛
        run: |
          npx esbuild src/engine/stalemate.ts --bundle --format=esm --outfile=/tmp/stalemate.mjs
          node scripts/check-stalemate.mjs /tmp/stalemate.mjs
      # 主菜单鱼眼转盘的三份纯函数地基（形变 / 弹簧 / 滚轮归一化）。这三样出错
      # 不会白屏、不会报错，只会让转盘「选中框没对准图标」「环合不上裂一道缝」
      # 「鼠标一格跳一下、触控板顺滑滑行」——都是看着像设计如此的毛病，只有拿数
      # 去量才认得出来。纯逻辑、几十毫秒。
      - name: 鱼眼转盘的形变与输入
        run: |
          npx esbuild src/engine/fisheye.ts --bundle --format=esm --outfile=/tmp/fisheye.mjs
          npx esbuild src/engine/spring.ts --bundle --format=esm --outfile=/tmp/spring.mjs
          npx esbuild src/engine/wheelSpin.ts --bundle --format=esm --outfile=/tmp/spin.mjs
          node scripts/check-fisheye.mjs /tmp/fisheye.mjs /tmp/spring.mjs /tmp/spin.mjs
      # 同一条轴的**时间**那一维：追赶、弹簧、橡皮筋、速度倾斜。上面那道门量的是
      # 形变（位置的函数），这道门量的是「同一段真实时间，帧率不同结果要一样」。
      # 帧率相关的毛病不会白屏、不会报错，只会让同一条轴在 30Hz（低电量模式）和
      # 120Hz 的机器上手感不同——那种事玩家报不清楚，我们也量不出来。
      # 纯逻辑、几十毫秒。
      - name: 鱼眼转盘的运动学
        run: |
          npx esbuild src/engine/axisMotion.ts --bundle --format=esm --outfile=/tmp/axismotion.mjs
          npx esbuild src/engine/spring.ts --bundle --format=esm --outfile=/tmp/spring.mjs
          node scripts/check-axis-motion.mjs /tmp/axismotion.mjs /tmp/spring.mjs
      # Kinetics 那一批手感件里三条纯判定：通关章盖在哪一种终局上、粘贴进来的码
      # 怎么洗、六段完成度表填几段。三条都是「错了不报错」——章会盖在被炸出去的
      # 那一局上，对的码会被说成不对，第七段会画到框外面。纯逻辑、几十毫秒。
      - name: 手感件的三条判定
        run: |
          npx esbuild src/engine/kinetics.ts --bundle --format=esm --outfile=/tmp/kinetics.mjs
          node scripts/check-kinetics.mjs /tmp/kinetics.mjs
      # 存档键的后缀带着规则版本号，而它已经错过两次：规则升版本、写存档那一头的
      # 字面量没跟着改，于是新规则的局落进上一版规则的归档——记录页上不出现、累计
      # 得分里不算、结算页那个「本机最佳」还钉在一个现行规则下打不出来的旧数字上。
      # 全程不报错。这道门量两件事：后缀必须由版本常量生成，以及八副棋盘和 main.ts
      # 里谁都不许再手写后缀（后一半才是真保险——它拦的是这件事本身，不是某次错字）。
      - name: 存档键跟着规则版本走
        run: |
          npx esbuild src/engine/runKey.ts --bundle --format=esm --outfile=/tmp/runkey.mjs
          node scripts/check-run-key.mjs /tmp/runkey.mjs
      # 登录／改密那几扇窗的表单件。三件事各盯一个「错了不报错」：给密码管理器的那一串
      # name/autocomplete/type 标注一个都没被动过（改掉之后不报错，只是管理器从此不提示
      # 保存）、field() 的 DOM 顺序是 input 在前（浮动标签靠相邻兄弟，只能往后看）、六段
      # 完成度表只挂在设新密码那几处而不是登录页。读源码、几十毫秒。
      - name: 登录表单那几个零件
        run: node scripts/check-auth-form.mjs
      # 「连得更多得更多分」全落在这两个「把种子往外长」的函数上。八个玩法的
      # findMatches 都靠它们，长不动就是四连永远只值 4 分，长过头就是白送分。
      # 门早就写好了，只是一直漏在 CI 外面——纯逻辑、几十毫秒，没有理由不收。
      - name: 得分图案怎么长大
        run: |
          npx esbuild src/engine/matchGrowth.ts --bundle --format=esm --outfile=/tmp/growth.mjs
          node scripts/check-match-growth.mjs /tmp/growth.mjs
      # 炸弹 2026-09 改了规则（拆弹 + 一枚永久炸弹），牵着六副棋盘和两个引擎文件
      # 一起动。这道门一半喂函数（发牌配平、认活炸弹、拆掉的格子并进遮罩），一半
      # 对着源码验那几处接线还在——错了不会崩，只会让玩家莫名其妙输一局或少拿分。
      - name: 炸弹的新规则
        run: |
          npx esbuild src/engine/bomb.ts --bundle --format=esm --outfile=/tmp/bomb.mjs
          npx esbuild src/engine/scoring.ts --bundle --format=esm --outfile=/tmp/scoring.mjs
          node scripts/check-bomb-rules.mjs /tmp/bomb.mjs /tmp/scoring.mjs
      # 棋盘底下那块教学条（第 15 推重写）：五条各等它自己说的那件事在盘面上真的出现
      # ——开局 12 秒、紧跟、段数 ≤ 4、某色星星 ≥ 最短外边、第一次消掉外边。这道门用模拟
      # 盘面（真的侵蚀阶梯、真的外边几何、棋盘真用的那个数法）把五个时机依次走一遍，差
      # 一枚、差一毫秒都不许换条；再验呼吸灯的零件：一层穷举走法是不是残局穷举那一套、
      # 组有没有映射回此刻的位置（要滑过去的那一枚在里面）、超 8ms 是不是真的放弃、挑组
      # 是不是「保留 → 最近 → 熄灭」、一盏灯亮的是不是那一步结算时动到的全部（方案 3-E-2）。
      # 假时钟、自带小 DOM，不开浏览器，几十毫秒。
      - name: 教学条：五条的时机，呼吸灯的零件
        run: |
          npx esbuild src/ui/coachBar.ts --bundle --format=esm --outfile=/tmp/coach.mjs
          npx esbuild src/i18n.ts --bundle --format=esm --outfile=/tmp/i18n.mjs
          npx esbuild src/engine/coachHint.ts --bundle --format=esm --outfile=/tmp/coachhint.mjs
          npx esbuild src/engine/outerEdge.ts --bundle --format=esm --outfile=/tmp/outeredge.mjs
          npx esbuild src/engine/erosion.ts --bundle --format=esm --outfile=/tmp/erosion.mjs
          npx esbuild src/engine/residueBoard.ts --bundle --format=esm --outfile=/tmp/resboard.mjs
          node scripts/check-coach.mjs /tmp/coach.mjs /tmp/i18n.mjs /tmp/coachhint.mjs /tmp/outeredge.mjs /tmp/erosion.mjs /tmp/resboard.mjs
      # 教学第 4 条（星星消除）挑哪一色、亮哪几枚（2026-10-08 方案 3-E-3：starClearHintFor）。三个手摆的
      # 局面各钉一步——星星多的那一色输给外边上已经有得多的那一色；差得一样多时星星少的赢（它在盘面上排
      # 在后面，按先碰到的挑会挑错）；外边上摆满四颗却只有四颗、填不满五格的那一色被筛掉。纯 node。
      - name: 教学第 4 条挑哪一色
        run: |
          npx esbuild src/engine/coachHint.ts --bundle --format=esm --outfile=/tmp/coachhint.mjs
          node scripts/check-star-clear.mjs /tmp/coachhint.mjs
      # 跑不动的机器上自动把粒子和震屏降一档。判错的两种后果不对称：该降没降
      # 只是继续卡，**不该降却降了**是一台好手机上特效突然少一半、而且这一局回
      # 不去。所以这里喂四种帧流，三种是「不该降」（开局那阵子、切后台那一帧、
      # 偶尔一帧毛刺），一种是「该降」。时钟和 rAF 都是假的，几十毫秒。
      - name: 跑不动时才降档
        run: |
          npx esbuild src/engine/frameTier.ts --bundle --format=esm --outfile=/tmp/tier.mjs
          node scripts/check-frame-tier.mjs /tmp/tier.mjs
      # 屋主连点两下《再来》只能开出一局。两条 start 都会被服务器办成（它们看到
      # 的是同一份「上一局已结束」的快照），而每条各自随机一个新种子——库里留后
      # 到那条的，屋主用先回来那条的，于是屋主和大家不是同一副牌。把 fetch 换成
      # 会数次数的假货，量的就是「发出去了几条」。
      - name: 开局只开一次
        run: |
          npx esbuild src/engine/room.ts --bundle --format=esm --platform=neutral --outfile=/tmp/mproom.mjs
          node scripts/check-room-start-once.mjs /tmp/mproom.mjs
      # 屋主出状况时谁该被叫停、谁该接着打。`hostTroubleIn` 回 'gone' 的后果比它看
      # 起来重：scoreboard 的 roomOver 拿它当「小屋散了」，一判散场就把正在打的人
      # 就地转成单人局，那一局的分再也回不到榜上。而 'gone' 里从前含着「90 秒没心
      # 跳」——手机进后台、接个电话、过个隧道，90 秒都是常态，于是「屋主手机一黑，
      # 满屋人全被踢出这一局」。两处边界 2026-10-03 都往「别踢人」那头挪了：倒数和
      # 对局中屋主的状态一概不算数（所有屋子，不只竞赛屋），而「太久没动静」归到
      # 「等他一下」那一档。纯逻辑、几十毫秒，六十条。
      - name: 屋主不见了，谁该接着打
        run: |
          node scripts/check-host-trouble.mjs /tmp/mproom.mjs

      # 服务端：权限、战绩与排行榜、兑换码的竞态。都用内存里的 Redis 替身，
      # 不连任何外部服务。
      - name: 谁算天才（权限）
        run: node scripts/check-entitlement.mjs

      # 终身授予那一句挂在哪儿。读源码，不跑行为——它的四个要害全在「写在第几行」
      # 上：没 import 就用（登录接口运行时 ReferenceError，全站登不进去，而
      # `node --check` 和 typecheck 都查不出来——api/ 是纯 .js，不过 tsc）、排在
      # resolveEntitlement 后面（这一次登录看不到自己是天才）、丢了 issued 那一半守卫
      # （身份没证明就送权益）、不把结果赋回 account（库里写了、手上那份还是旧的）。
      - name: 终身授予那一句的位置
        run: node scripts/check-grant-callsite.mjs

      # 缺 `kind` 字段的老账号不许被判成刷卡用户。纯 node，内存版 store，整道门跑在
      # 「Creem 没配」那一侧——而三个 CREEM_* 环境变量清掉之后，那就是每一次登录都要
      # 走的那一支，判错的代价是 503 不带令牌、那个人登不进自己的账号。
      # 反向尺子在内存里把判据改回 `=== 'code'` 再 import 一次，所以它不会随 HEAD 过期。
      - name: 缺 kind 的老账号算哪一种
        run: node scripts/check-kind-default.mjs

      # 注册 / 登录那条新路：一个邮箱，一张六位验证码（E37）。纯 node——直接 import
      # handler，账号库用内存那份，Resend 那一次 HTTP 用假 fetch 顶掉（而且能让它失败，
      # 那正是 E51 那一支要量的）。在进程里跑是**非这样不行**的：验证码只存在库里和那封
      # 信里，起服务器的话这道门读不到码，只能去断言「回了 200」。
      - name: 验证码注册 / 登录
        run: node scripts/check-signin-otp.mjs

      # 验证码不许被外人破坏（#19）。从前码和「猜了几次」都按**地址**存，而这个接口对谁都
      # 发信——于是任何知道某人邮箱的人都能把他挡在门外，不需要任何凭据：替他要一张新码就
      # 把他那张覆盖掉，或者拿他的地址乱猜 5 次就把他那张删掉。全程他只会觉得「这个网站的
      # 验证码是坏的」。现在码和计数都按**那一次**发出去的票存，票只回给要码的那台设备。
      - name: 验证码只毁得了自己那一张
        run: node scripts/check-signin-challenge.mjs

      # 免邮箱凭据那条路（E38）。最要紧的一条是「大小写真的分得开」：normalizeEmail 会
      # toLowerCase，第一串直接当 id 的话 Abc12345 / abc12345 / ABC12345 当场撞成一个，
      # 而界面上明写着区分大小写。解法是 sha256（pairKey）。
      - name: 免邮箱凭据注册 / 登录 / 重设
        run: node scripts/check-handle-auth.mjs

      # 三种账号 id 的键空间永不相交（acct:邮箱 / acct:code:大写 / acct:hdl:sha256）。
      # 撞了就是两个人共用一个账号，而且静默。
      - name: 三种账号 id 的键空间
        run: node scripts/check-key-space.mjs

      # 排行榜每一行不许带身份。榜里存的 member 是账号 id：邮箱账号就是那个邮箱，免邮箱
      # 账号是 hdl:<sha256>——前者是别人的私事，后者是一把能直接用在别处的钥匙。
      - name: 排行榜不许漏身份
        run: node scripts/check-board-no-id.mjs

      # 排行榜「新不新」那几件事：十秒内存缓存（来回点标签不闪）、打完一局作废缓存（刚刷
      # 新了自己的最高分，点开榜要看得到）、上报失败隔两秒再试一次、等上报有上限（真断网
      # 也不许停在「加载中」）、上报不带名字（第 16 推：昵称只走改名接口）。
      #
      # 纯 node：cloudScores.ts 只碰 fetch 和 localStorage 两样浏览器的东西，两样都用假的
      # 顶掉，于是整条路都是真的在跑，只有网络那一下是假的。
      - name: 排行榜刷新与缓存
        run: |
          npx esbuild src/engine/cloudScores.ts --bundle --format=esm --outfile=/tmp/cloudscores.mjs
          node scripts/check-board-refresh.mjs /tmp/cloudscores.mjs

      # 一个帐号一个昵称（第 16 推）：改名立刻上榜、别的设备上传不覆盖、两个帐号抢同一个名字
      # 只有一个成功（含大小写、全半角）、旧名字放出来、词表和保留名、12 个码点不截断、换邮箱
      # 和删帐号时索引跟着走、迁移规则对而且回包里一个名字都没有、客户端缓存与自动上传、小红书
      # 产物里没有 /api/scores。纯 node（客户端那一半在门里当场用 esbuild 打包）。
      - name: 一个帐号一个昵称
        run: node scripts/check-nickname.mjs

      # 小屋里叫什么：没取名字发字母、重名加编号、认领座位不串门；第 16 推起还有座位名不写进
      # 昵称、没登录的人撞上登记过的昵称得「 2」、登录的人拿原名、局中改名由改名的人加「 2」。
      - name: 小屋里的名字
        run: node scripts/check-room-names.mjs

      # 注册那条路：从「填邮箱 + 六位密码」一直走到「用同一组凭据登录回来」。
      #
      # 要起 dev-server（内存版 store），但**不要浏览器**——服务端那半用 fetch 直接打，
      # 客户端那半读源码。所以它留在这个快 job 里，不去 browser 那一条。
      #
      # 环境变量只要一个。名额那一套 2026-10-02 撤了（E39），所以不再压 GENIUS_GRANT_LIMIT。
      #
      # 一个门一台服务器、一人一个端口（CLAUDE.md 那条规矩）。起完用一个有界的 curl
      # 循环等它真的起来；盲等固定秒数在 CI 上会出偶发红，而偶发红最后一定会被人加
      # continue-on-error。
      #
      # ⚠️ 探的是 **/**（首页），不是某个接口。原先探的是 `/api/slots`，而那个接口在
      # 2026-10-02 随名额一起删了（E39）——于是那个 curl 永远 404，循环每次都空等满 30
      # 秒，后面那句硬探必败，整步红。**探活要探一样不会被删的东西**，首页就是那样东西。
      - name: 注册 → 登录 → 终身授予
        run: |
          GENIUS_GRANT_WINDOW=1 node scripts/dev-server.mjs 8993 dist &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8993/ > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8993/ > /dev/null
          node scripts/check-register.mjs http://localhost:8993/
      - name: 战绩与排行榜
        run: ALLOW_MEMORY_STORE=1 node scripts/check-scores.mjs
      # 交卷那一路的几道闸。都不是反作弊（分数本来就没法复算，见 api/scores.js 文件
      # 头），拦的是**同一局在库里留下两份互相打脸的记录**：榜是 score 写的、重建是
      # 照存档里的 run.score 重算的、而玩家自己那一页画的是 data.totalScore——两处对
      # 不上就成了「榜上写 999999，点开这一局的战绩图写 300」。另外三道：带了 data 就
      # 得是一份记录（这一句必须排在规则闸前面才够得着）、那份 data 不许大过 4096 字
      # （它被原样塞进存档，而存档是整体读写的，rebuild 要把全站每个人的都读一遍）、
      # 一个账号一小时 300 局（键是账号不是 IP：要拦的正是「往自己名下灌」）。分数上
      # 限先只记日志、不拦截，而那行日志里不许有邮箱。半秒。
      - name: 交卷那几道闸
        run: node scripts/check-scores-guard.mjs
      # 玩家交卷的那一瞬间管理员点了《重建榜单》：重建读出整份 stats（total /
      # runs / best / seen 四个字段住在同一份 JSON 里），只改 best，写整份回去
      # ——四个字段一起回退。而它**从来不重算 total 和 runs**，所以再点一次重建
      # 只救得回 best，那两个数永久错着：玩家《记录与排名》上的累计得分凭空少一
      # 局，管理员那一侧全绿。这道门扫 31 档时序偏移（把交卷放在重建那一段的每
      # 个位置），不注入延迟、不留测试口子。两秒。
      - name: 交卷撞重建榜单
        run: node scripts/check-stats-race.mjs
      # 锁只许持锁的那一位放（2026-10-08 方案 1-5）。被圈住的那一段跑过了锁的 10 秒期限，锁早
      # 就过期、别人已经拿到了——从前放手时那一句无条件 DEL 删的是他的锁，两个人同时在锁里，后
      # 写的旧快照盖掉新数据。纯 node；真库那条路（Upstash 的 EVAL）用一个假 fetch 顶着量。
      - name: 锁只许持锁的那一位放
        run: node scripts/check-lock-owner.mjs
      - name: 内部码信箱
        run: ALLOW_MEMORY_STORE=1 node scripts/check-inbox.mjs
      - name: Creem 那道门开在哪儿
        run: ALLOW_MEMORY_STORE=1 node scripts/check-creem-gate.mjs
      - name: 发码接口的限速
        run: ALLOW_MEMORY_STORE=1 node scripts/check-mint-limit.mjs
      # 同一个账号几乎同时兑两张码，两张的时长都要真的加上去。朴素的「读—改—
      # 写」会让后写的那一份把前一次盖掉：两张码都吃掉、两次都说成功，账号上
      # 只多了一个月，而且玩家和客服都查不出来。不连任何外部服务，几百毫秒。
      - name: 兑码的并发
        run: ALLOW_MEMORY_STORE=1 node scripts/check-redeem-race.mjs
      # 付费入口也要限速。它曾是全站唯一一个「碰钱却没限速」的漏网之鱼，而浏览
      # 器那头早就写好了收到 429 该说什么——前后端说好了的事，服务端一直空着。
      # 不连 Creem（那一跳换成会数次数的假货），几百毫秒。
      - name: 付费入口的限速
        run: ALLOW_MEMORY_STORE=1 node scripts/check-checkout-limit.mjs
      - name: 账户：兑码落到账户上、改密码、换邮箱
        run: node scripts/check-account-hub.mjs
      # 开账号那三条路（绑内部码 / 刷卡设密码 / 确认换邮箱）从前都是「先看一眼
      # 这个地址有没有人，再整份写进去」。一家人共用一个邮箱、两个人各拿一张码前
      # 后脚点《绑定》，两边都读到「没人」——两边都显示成功，两张码都被吃掉，库里
      # 只留后写的那一份，先操作那人的令牌当场作废。并发那几条用 Promise.all 一
      # 起发；一条一条发的版本永远是绿的。
      - name: 开账号：两个人抢同一个邮箱
        run: node scripts/check-account-race.mjs
      # 从外面看这几扇门：登录接口不能当查号机（有号没号、带没带令牌、令牌对不对，三种答
      # 的是同一句，而且走同一行代码），账号中心要按来路限速。改密码那一支 2026-10 撤了。
      - name: 认证：查号机与来路限速
        run: node scripts/check-auth-probe.mjs

      # 抢注：别人先用你的邮箱开了账号，而你一个字都看不出来。
      #
      # 旧的 `register: true` 那一支不要任何凭据就能在任意邮箱上开出账号，还带着一把它自己
      # 设的密码。真正的主人将来拿验证码登录时，从前只是「添一把令牌」——两个人从此都进得
      # 去，而屏幕上什么都不报。那一支撤了，而已经被抢注的地址靠 signin.js 的 confirm 收场
      # （第一次验成功时把旧凭据整个清掉）。
      #
      # 这一条两个方向都会出错、而且症状相反（清不够 / 清过头），所以门里每条断言都有一条
      # 反着的在盯。十种改坏法都真的试过一遍。
      - name: 抢注：第一次验成功要把旧凭据清掉
        run: node scripts/check-preclaim.mjs

      # 锁开之后「每 4 小时一次机会」——这句话从前是假的：checkPin 开头那句 lockUntil 判的
      # 是调用方手里的快照，一次并发就能让成千上万个请求同时越过它，而免邮箱账号那一支没有
      # 封号那道硬闸。现在靠一张 SET NX 的票坐实了。
      - name: 一个锁期只许比对一次
        run: node scripts/check-pin-window.mjs

      # 限速的桶名。IPv6 下家宽标配分到的是一整个 /64，换一个源地址不花一分钱——按单个地址
      # 分桶等于不限速，而限速那一侧看着还在工作。收到 /64；同时**不许**收得更粗。
      - name: 限速按谁分桶
        run: node scripts/check-ratelimit-bucket.mjs

      # 运维日志里不许躺着玩家的邮箱。那份日志在后台留 30 天，而出错时人最爱整段往外贴。
      # 顺带钉住唯一一处**有意**写原文的例外（redeem 的 giveBack），免得有人去「修」它。
      - name: 日志里不许写身份
        run: node scripts/check-log-redact.mjs

      # `.env.example` 是唯一一份「这个项目要配哪几样」的清单（.env 是 gitignore 的）。配漏
      # 一样的后果 CLAUDE.md 里每一条都真的发生过；而 GENIUS_GRANT_WINDOW 从来就没写进模板，
      # 于是新开一份部署默认是关的——玩家照着界面上那句写死的承诺去登录，登得进、却不是天
      # 才，屏幕上什么都不报。
      - name: 环境变量清单和代码对得上
        run: node scripts/check-env-example.mjs
      # 小屋里两件「谁写谁赢」的事：催屋主不能把刚开的一局抹掉，关了网页的人
      # 不该让全屋再等九十秒。直接叫 api/room.js 的 handler，不起服务器。
      - name: 小屋：催促与开局抢数据、关了网页的座位
        run: node scripts/check-room-race.mjs
      # 小屋的两本账：真断线的人不该让往后每一局都重新等满九十秒，座位被借走
      # 的人回来要重新坐得回去（不然他占着名额却没有椅子，屋里会写出「9/8」）。
      # 同样直接叫 handler，「还算不算在」那条规则是纯函数，不用真等九十秒。
      - name: 小屋：还算不算在、椅子还在不在
        run: node scripts/check-room-seat.mjs
      # 同一名玩家的几条路同时落地：报分撞心跳 / 撞关网页 / 撞点《离开》/ 撞看
      # 教学，以及断线重连带回来的旧局次。玩家看到的是「分数对不上」和「全屋卡
      # 着等一个已经交过卷的人」。并发那几条用 Promise.all 一起发——一条一条发
      # 的版本永远是绿的，量不到任何东西。同样直接叫 handler。
      - name: 小屋：同一个人的几条路同时落地
        run: node scripts/check-room-races.mjs
      # 报分那条路上三件事：散场之后不收（原先那道「收尾中」只挡 20 秒，而一份报分
      # 迟到 20 秒太平常——写进去就是战绩卡把最后一局算两遍，量到的是 200+190）；交
      # 过卷之后迟到的那条「还在打」盖不动它（一局里报很多次，而它们是 void 发出去
      # 的，后发先至就把交卷的勾和分数一起退回去，屋里还要为他干等 90 秒）；用时说
      # 不通只丢用时、分照记（尺子是「这一局已经开了多久 + 15 秒」，而且只在开赛之
      # 后才架得起来）。摆库不真等，两百毫秒。
      - name: 小屋：报分的三道闸
        run: node scripts/check-room-score.mjs
      # 屋主「不等了」（2026-10-08 方案 2-6）：一人挂机，不按就开不了下一局（普通局不限时，这一条
      # 不动）；屋主按了，没交卷的人按 sitOut 替他交卷（分数按服务器记着的那份、0 分照记），下一局
      # 照常开、这一局照记；他过后打完报上来的分收不下；只有屋主按得动；倒数里不收；竞赛屋的主持
      # 人和这一局开了之后才进来的人不替。直接叫 handler，摆库不真等。
      - name: 小屋：屋主「不等了」
        run: node scripts/check-room-force.mjs
      # 「有人去看教学，大家等他」挂得起来也挂得有个头：只在开赛之前挂得起来（开打
      # 之后点开教学复习的人从前照样能把整屋拦住，而那会把还在打的人退回倒数屏）、
      # 最多挂 90 秒（「二十秒没点就不等他」要有人轮询才生效，屋里全切后台时他每点
      # 一下还把二十秒续上）、放行之后屏幕上不许再说「正在等他」（倒数已经在走）。
      - name: 小屋：等谁看教学，等多久
        run: node scripts/check-room-learn.mjs
      # 坐满了的屋子收谁的椅子。从前只认「网页真的关掉了」，而手机进后台、电没了、
      # 地铁里断网一个都不发 bye——那把椅子一直占着，门外的人只能等整间屋过期，而这
      # 一局早就不等他了（同一个 90 秒）。另一半同样要钉：seatReclaimable（**同名的
      # 人**来认领，拿到的是名字和分数）一个字都没动，不能因为他进了个隧道就把成绩
      # 交给一个恰好同名的人。
      - name: 小屋：坐满之后收谁的椅子
        run: node scripts/check-room-reclaim.mjs
      # 开局多留的那四秒（「屋里可能有新手」）只给有教学的那两族。网页那头的
      # seenTutorials() 只会回 square 和 circle，所以三角那一族的 seen 永远是空的
      # ——大三角那间屋**每一局**都被判成「可能有新手」：倒数永远从 8 数起，每一局都
      # 把「你会不会玩」弹到每个人脸上，而屋里没有一个人能让它停下来。
      - name: 小屋：多留那四秒只给两族
        run: node scripts/check-room-novice.mjs
      # 一次小屋请求失败了，屏幕上该写哪一句——这件事从前有两份答案。main.ts 开局那
      # 一路自己拼了两分支（tooFew 说「人太少」，其余一律说「小屋还没开放」），而
      # startMatch 答得出六种。最冤的是被限速挡住那一次：屋子开着、人也够，屏幕上写
      # 着「小屋还没开放」，于是屋主一遍遍地按。读源码、不打包。
      - name: 小屋：失败话术只有一份
        run: node scripts/check-room-errortext.mjs
      # 竞赛屋（玩家 2026-09：「上限 20 人、发起人不参加游戏单独看到实时榜单情况」）。
      # 「主持人不参赛」听着像界面规矩，其实是服务端三件事：这一局不等他（不然全屋
      # 交完卷要干等 90 秒）、账上不能有他（不然竞赛排名图上多一个打了十局全是 0 的
      # 人）、两个人才算一场比赛（问的必须是「下场比的有几个」）。每一条都配了一条
      # 普通八人屋的对照——那边屋主照旧下场，这一改一个字都不许影响它。
      # 界面那一半（二十行榜单摆不摆得下）要开浏览器，留在本地手跑：
      # check-room-contest-ui.mjs。
      - name: 小屋：竞赛屋的规矩
        run: node scripts/check-room-contest.mjs
      # 拨开 Pro 之后，《开小屋》那颗键上**只换中间那一段字**（玩家 2026-09：「Open a
      # room 中只有 room 一词动态被替换成了 contest」）。i18n 里因此多了一对
      # mpCreateNoun / mpContestNoun，和原来那两整句之间有两条咬死的关系：换得出来、
      # 换完一字不差。断掉不会崩也不会红——找不到那一段就悄悄退回整句换，换出来对不上
      # 则是屏幕上多出一句谁也没写过的话（法文只换名词不换冠词就是「Ouvrir une un
      # concours」）。四种语言各写各的，而翻译往往一次只改一处。读源码、不打包。
      - name: 小屋：那颗键上只换一个词
        run: node scripts/check-room-word.mjs
      # 八副棋盘「归哪一族、按哪一套规则讲」。从前四个函数各按 id 前缀猜一遍，而且对
      # 不认识的 id 给出三种不同的静默默认值（'square' / null / 'triangle'）——新棋盘的
      # id 只要不以 square / circle / triangle 开头，就会在三个地方被分进三个不同的家
      # 族，不报任何错：老虎机转错族的图案、《怎么玩》念错那一条、教学配图配错一族，
      # 三样各错各的。现在由棋盘自己在 card 里声明，这道门钉住那张表，并且不许那几个
      # 文件再回去按前缀猜。读源码、不打包，几十毫秒。
      - name: 八副棋盘的家族与规则归属
        run: node scripts/check-shape-registry.mjs
      # 《Pro》那个开关，以及它在棋盘上画的那一圈「这一枚得分之后会变成什么颜色」。
      # 要害是八副棋盘会不会有一副写错：描成 tile.color（它现在的颜色）不报错、不白
      # 屏，屏幕上一样是一圈彩色的线，只是它说的成了一句所有人一眼就看得见的废话。
      # 读源码、不打包。界面那一半（真画出来没有、拨开关灵不灵）要开浏览器，留在本地
      # 手跑：check-pro-ui.mjs。
      - name: Pro：那一圈描的是得分之后的颜色
        run: node scripts/check-pro.mjs
      # 另外两个服务端检查没收进来，各有原因，都不是「忘了」：
      # check-bind-race 要先起 dev-server（它打的是 8815 端口的真 HTTP），
      # check-store 要一份真的 Redis 凭证。两个都得本地跑。

      # 产物里的 CSS：自定义属性里不许写「新函数」（安卓上会整块不显示）。
      # 小屋那四个桶：该挡的挡住，**该放过的一个都不能误伤**。后者才是这道门的
      # 重点——callerId 认的是 IP，而小屋就是给朋友一起玩的，四个人常在同一个
      # Wi-Fi 后面，轮询每人每秒一次。桶给小了，一屋人打到一半集体断线，而屏幕
      # 上写的是「连不上网络」，他们会去查路由器。第一版差点就照一份建议里的
      # 3000 次/小时写（≈0.83 次/秒），这道门当场量出「80 次合法轮询被挡掉 60」。
      - name: 小屋限速：挡扫号，不挡朋友
        run: node scripts/check-room-rate.mjs
      # 《游戏规则》写的枚数要和棋盘真的有几枚一致。起因是「三角」和「大三角」
      # 两条 body 整段挂反了，四种语言全错——不崩、不红，只有玩家读到假话。这道
      # 门自己解开那个对调的陷阱（main.ts 里 triangle 跑的是 triangleBig.ts）。
      # 一局结束、下一局开始，中间不许漏东西过去。读源码，不打包也不开浏览器——这几
      # 件事全都没有可以从外面量的症状：不崩、不白屏、不报错，只是下一局的规则悄悄
      # 变了（收尾放开跨局），或者结算页干脆不弹（persistence 裸调 localStorage 抛在
      # endGame 中间），或者排着的那一拍落到一副已经结清的盘上。
      - name: 一局与下一局之间
        run: node scripts/check-run-lifecycle.mjs
      # 打到第 41 局，累计得分不许往下掉。那个数从前就是「存档这张清单的总和」，而存档只
      # 留最近 40 局——第 41 局那一下，最早那一局被挤出去，这个数当场掉了那一局的分。不报
      # 错、不白屏，只是那个数变小了，而玩家一直盯着它：看起来像我们把他的成绩弄丢了。现
      # 在挤出去的分记在一笔只加不减的总账上，读的时候加回去。纯 node（拿 Map 当
      # localStorage），几十毫秒。
      - name: 挤出存档的局，分数不许跟着消失
        run: |
          npx esbuild src/engine/persistence.ts --bundle --format=esm --platform=neutral --outfile=/tmp/persist.mjs
          node scripts/check-evicted-total.mjs /tmp/persist.mjs
      # 老虎机那一局的四件：完成奖励真的加上去（从前算好的那个数被计分那条路原样丢
      # 掉，一分都没生效过）、侵蚀先拆哪一枚按几何不按书写次序、降级那句话报的是真实
      # 枚数不是侵蚀级数（二十个目标里十个对不上）、八副棋盘的卡死门槛没有哪一副写死。
      - name: 老虎机：奖励、拆法、报数、门槛
        run: |
          npx esbuild src/engine/scoring.ts --bundle --format=esm --outfile=/tmp/scoring.mjs
          npx esbuild src/engine/targets.ts --bundle --format=esm --outfile=/tmp/targets.mjs
          npx esbuild src/engine/targetMatch.ts --bundle --format=esm --outfile=/tmp/match.mjs
          node scripts/check-slot-rules.mjs /tmp/scoring.mjs /tmp/targets.mjs /tmp/match.mjs
      # 小红书那一端的玩法表有七张（XhsMode / CARDS / perRow / onPlay 分派 /
      # FirstKey ＋ BOOKS / soon ＋ dim / check-vsweb 的 XHS_CARD）。加一档玩法要七张
      # 都动，而漏掉其中任何一张**都不会当场报错**：点《步步为营》打开的是无限反转
      # （兜底分支）、这一档打完的局在成绩页上整片不存在（BOOKS）、六张卡里只有它一张
      # 既不暗也没牌子（soon/dim）、check-vsweb 按下标点卡于是整道门在比错的两屏。顺带
      # 钉住「一次性清档两端各调一次」——它从前是 src/main.ts 的私有函数，小红书端一次
      # 都没跑过。读源码，不打包。
      #
      # 另外记一笔：`npm run typecheck`（tsc -b）**管不到 xhs/**，那一端走
      # xhs/tsconfig.json，所以上面「小红书端的类型」那一步不能省。
      - name: 小红书端的玩法表：七张要一起动
        run: node scripts/check-xhs-modes.mjs
      # 残局穷举兜底（v1.3.1 PR-15）。`stalemate.ts` 的判活只做计数，从不看几何，所以
      # 「数量够、摆法永远到不了」的残局被一直判活——玩家报过：剩几枚怎么滑都不得分，
      # 局却不结束。这一支守两头：三副真死局要答 dead（每一副都配一条「计数那层说活」
      # 的对照尺子，证明复现的就是那个 bug），而预算算不完的时候**一律 unknown、绝不是
      # dead**——判死那一侧错了会把还能打的局掐掉，比不结束更糟。读模块、不开浏览器。
      # 第四个包是棋盘到穷举那层转换（residueBoard）：六边圆球的中心洞扫描时要把两边断开、
      # 滑动时不动（2026-10-08 方案 2-4，从前压实了，洞两边两枚同色球被当成连着的）。
      - name: 残局穷举：该结束的要结束，算不完一律当活
        run: |
          npx esbuild src/engine/residueSearch.ts --bundle --format=esm --outfile=/tmp/residue.mjs
          npx esbuild src/engine/stalemate.ts     --bundle --format=esm --outfile=/tmp/stalemate.mjs
          npx esbuild src/engine/slideLine.ts     --bundle --format=esm --outfile=/tmp/slideline.mjs
          npx esbuild src/engine/residueBoard.ts  --bundle --format=esm --outfile=/tmp/residueboard.mjs
          node scripts/check-endgame-residue.mjs /tmp/residue.mjs /tmp/stalemate.mjs /tmp/slideline.mjs /tmp/residueboard.mjs
      # 滑一条线、炸弹连没连上（第 14 推）：五副外边族棋盘共用 engine/slideLine.ts 和
      # engine/bomb.ts 那几样。活格不到两枚的线拖了不算一步（从前白扣一步），大三角长滑不
      # 复制、不丢棋子（从前奇数长的线滑过 n−1 格会），每副棋盘每种线长、步数 −3n…3n 遍历。
      # 还在教旧规则的分镜动画（第 14 推）：入口全下线了。从网页和小红书两个入口顺着
      # import 走一遍，分镜那三个模块一个都不许在路上——只删按钮不断接线，哪天按钮加回来
      # 它就又活了。读源码、不打包。
      - name: 旧规则的分镜动画走不到了
        run: node scripts/check-story-retired.mjs
      - name: 滑一条线不复制、不丢、空线不扣步
        run: |
          npx esbuild src/engine/slideLine.ts --bundle --format=esm --outfile=/tmp/slideline.mjs
          npx esbuild src/engine/bomb.ts      --bundle --format=esm --outfile=/tmp/bomb.mjs
          node scripts/check-slide-line.mjs /tmp/slideline.mjs /tmp/bomb.mjs
      # 法务文本有没有在说「订阅还在卖」。CLAUDE.md：「支付审核把『网站陈述与实际不
      # 符』直接归为 false information，比缺一份文档严重。」这件事两头都咬过——先是
      # 「订阅开放后……」在早就开卖之后成了假话（Creem 审核原样引了回来），这一轮是反
      # 过来：2026-10 停售了，四种语言的《价格与订阅》还写着「目前是 1.99 美元／月」
      # 「每期结束会自动续期扣款」。四语四份文档，从前一道门都没有。
      #
      # 这道门跟着状态翻面（脚本里那个 SELLING）：重开订阅时把它改成 true，它钉的就是
      # 反过来那一套——**而不是把这道门删掉**。
      - name: 法务文本：现在到底卖不卖
        run: |
          npx esbuild src/legal.ts --bundle --format=esm --outfile=/tmp/legal.mjs
          node scripts/check-legal-sale.mjs /tmp/legal.mjs

      # 隐私政策说的，是这套代码此刻真做的那件事（E52）。2026-10 的改制换掉了身份本身
      # （没有密码、没有订阅、多了一种连邮箱都没有的账号），所以那份文档是**逐条重写**的
      # ——只加一节的话新旧两段会在同一页上互相打脸，而「网站陈述与实际不符」比缺一份文档
      # 严重。这一道钉「撤掉的说法不在、新的事实写到了、四种语言一个都没漏」。
      - name: 隐私政策和代码对得上
        run: |
          npx esbuild src/legal.ts --bundle --format=esm --outfile=/tmp/legal.mjs
          node scripts/check-privacy-truth.mjs /tmp/legal.mjs
      # 残局穷举的**接线层**：六副棋盘把自己的线和格子交给搜索件，编码错一点它就在算另
      # 一副棋盘，而且会言之凿凿地答 'dead'——那一侧会把一局还能打的棋盘 1.4 秒直接结
      # 算。三件真会接错的事各有一条：活炸弹要进盘面（它占着一格、跟着线一起滑，而
      # liveTiles() 把它排除在外）、不在盘上的格子不许占位、「可用 ≤16 枚」数的是非
      # RESIDUE_BLANK 那几枚。
      # ⚠️ 这段话 2026-10-02 之前写的是「空白也跟着线一起滑」。那是星星消除那个年代的事：
      # 外边族自 PR-3 起是「削掉的格子离场」，空白压根不进线，而那句错着的注释底下躺了一
      # 个多月的错接线（五副棋盘的 residueAt 把空白编成「跟着滑的无色球」），每一道门都
      # 绿。
      # 第二份打包是给【7】【8】用的：那两节拿**真的小球线**做 fixture，再用一个不设预算的
      # 精确搜索当对照（活局误判必须是 0，死局检出 ≥ 80%）。判「这个盘面得不得分」用的是
      # residueSearch.ts 自己导出的 scoresNow——门拿它当尺子，不另抄一份判定。
      # 「消除之后剩下的部分整体放大」那一点算术（玩家 2026-10 推翻 PR-3 的「棋盘一圈
      # 圈变小」）。三件真会出的事故各有一条：**开局不许动**（基准取成底板的话小球那副开
      # 局就被放大 1.01 倍，每一枚都挪一两个像素，而屏幕上只看出「和昨天不一样」）、zoom
      # 只增不减（棋子突然缩回去，玩家以为自己点错了什么）、放大之后不许出界（看不见的棋
      # 子玩家只会当成卡死）。
      #
      # 还有一条是**量不出来的那种洞**补上的：有意偏着摆的那一副（六边三角那个
      # GLOBAL_ROW_OFFSET）要把偏移原样带着走。小球那副的老锚点恰好就在底板正中，所以单
      # 拿它量，「照老锚点」和「照底板居中」两种写法答案一模一样——写错了照旧全绿。
      - name: 消除之后整体放大那一点算术
        run: |
          npx esbuild src/engine/liveFit.ts --bundle --format=esm --outfile=/tmp/livefit.mjs
          node scripts/check-live-fit.mjs /tmp/livefit.mjs
      - name: 残局穷举：喂进去的那副盘面对不对
        run: |
          npx esbuild src/engine/residueBoard.ts  --bundle --format=esm --outfile=/tmp/resboard.mjs
          npx esbuild src/engine/residueSearch.ts --bundle --format=esm --outfile=/tmp/ressearch.mjs
          node scripts/check-residue-board.mjs /tmp/resboard.mjs /tmp/ressearch.mjs
      # 上面两道守的都是**零件**（搜索件答得对不对、喂进去的盘面对不对），没有人守**调用
      # 点**——而调用点是同一段话抄了五遍（五副外边族棋盘），这个仓库为「同一件事手写了
      # 十六遍」写过一整篇文件头注释，知道这种东西怎么烂：改一处、漏四处，全都不报错。
      #
      # 这一段里最要命的一行是「只有 'dead' 才判死」：写成 `verdict !== 'scores'` 的话，
      # `'unknown'`（预算用完、算不出来）会被当成死局，**把一局还能打的棋盘 1.4 秒直接结
      # 算**——而 residueSearch 的文件头写着「算不完一律当活」。另外三条：计数说死就直接
      # 回、≤16 枚那道守卫、三角要多传「只许偶数步」。外加控制器那一头真的会结算、而且是
      # §4 写的那 1.4 秒。六个反证逐条验过。
      - name: 残局穷举：五副棋盘的接线一处都没断
        run: node scripts/check-residue-wiring.mjs
      - name: 规则里的枚数
        run: node scripts/check-rules-counts.mjs
      # 发信失败必须留痕（_mail.js 的 sendMail 自己写日志，不写收件地址）。把 Resend
      # 那一跳换成必然 401 / 必然抛的假货，不连网。第 20 推之前叫 check-unlock-mail，
      # 绕道 unlock.js 量；unlock.js 回 410 之后改成直接调 sendMail。
      - name: 发信失败留得下痕
        run: node scripts/check-mail-trace.mjs
      - name: CSS 兜底
        run: node scripts/check-css-fallbacks.mjs
      # 会呼吸的光：@keyframes 里 drop-shadow 的模糊半径一整圈都不许变，要明灭
      # 就改颜色。半径一变，滤镜区域每帧都跟着变，iOS 的 Safari 会把挨着的几个
      # 发光元素并成一块不透明的方框——玩家实拍到的「主菜单两张卡外面罩着个发
      # 光的透明方块」就是这么来的。读 CSS 就完了，不到一秒。
      - name: 会呼吸的光
        run: node scripts/check-glow.mjs
      # 小红书那一版的样式降级：clamp/min/max 会被 downlevel() 当场算成 px，因为
      # Chrome 61 不认这三个函数。算不掉的原样留着，而留着就等于在 Chrome 61 上
      # **整条声明被丢掉**（不是退回上一条，是那条声明没有了）。所以每一条算不掉
      # 的都必须有退路：同一处自己写了两行、baseline.css 里手写了等价规则、或者那
      # 段代码 Chrome 61 根本走不到。三样都没有就是裸的，那就是某处排版在老内核上
      # 无声地塌了——`--home-card-cap` 那次就是这么塌的（横屏第一张卡差 69px），
      # 而当时唯一能验证它的门要开浏览器、还要有人先跑 preview:xhs，那一次预览页
      # 是旧的，于是报了「全部通过」。假绿比没有门更坏。这道门不开浏览器、不看预
      # 览页，几十毫秒。
      - name: 降级层：算不掉的都有退路
        run: |
          npx esbuild xhs/src/oldKernel.ts --bundle --format=esm --outfile=/tmp/oldkernel.mjs
          node scripts/check-downlevel.mjs /tmp/oldkernel.mjs
      # 计分：**每翻一枚 +2**（《侵蚀阶梯》v1.2 §1）。这一道接替了 check-star-score
      # （《星星跟随色块消除》连同「纯星星组＝枚数²＋消除」整条路一起退役）。量的
      # 是成效不是字面量：两组共用的那一枚只算一次、混合组按翻面枚数算、全是星星的
      # 线无事发生、拆掉的炸弹在 commit 的回报里多出一枚。
      - name: 计分：每翻一枚 +2
        run: |
          npx esbuild src/engine/scoring.ts --bundle --format=esm --outfile=/tmp/scoring.mjs
          node scripts/check-flip-score.mjs /tmp/scoring.mjs
      # HUD 那一块《得分图案》画的枚数，必须等于**此刻**的级数。玩家实测报过一条
      # off-by-one（「显示的是解锁之后那一级」，v1.3.1 的 E25），方案点名要「以回归测试
      # 驱动修复」——这就是那个测试。它自己抄一份 §2 的段数表（不从 erosion 读，不然就成
      # 了「它说它是对的」），一枚一枚翻到底核每一步的级数，再核 1×N 图标和老虎机那一路
      # 各自画几枚。末位淡出的下限也钉在这儿：0.15 那一版四枚在屏幕上读起来就是三枚，那
      # 是同一个 bug 的另一半，而且是**看起来**的那一半。纯逻辑、几十毫秒。
      - name: 图案块画的是当前那一级
        run: |
          npx esbuild src/engine/erosion.ts --bundle --format=esm --outfile=/tmp/erosion.mjs
          npx esbuild src/engine/patternIcon.ts --bundle --format=esm --outfile=/tmp/paticon.mjs
          npx esbuild src/engine/targets.ts --bundle --format=esm --outfile=/tmp/targets.mjs
          npx esbuild src/engine/targetMatch.ts --bundle --format=esm --outfile=/tmp/match.mjs
          node scripts/check-pattern-level.mjs /tmp/erosion.mjs /tmp/paticon.mjs /tmp/targets.mjs /tmp/match.mjs
      # 三个带钟的玩法一个时长（§7：统一 100 秒）。它盯的是「生效的那个数」和「屏幕上
      # 写着的那些数」分家——真出过：《无限反转》120→60 那一次，小红书那一份是手抄的，
      # 落后过一版；而「60s 挑战」和炸弹图标上那枚「90s」一直是手写的字，和生效的秒数
      # 没有任何关系。改一头忘一头，屏幕上写着一个数、局里跑着另一个数，玩家没法发现。
      # 这道门自己抄一份 100（不从常量读，不然只证明「大家抄的是同一个数」）。纯逻辑。
      - name: 三个时长统一 100 秒
        run: |
          npx esbuild src/i18n.ts --bundle --format=esm --outfile=/tmp/i18n.mjs
          npx esbuild src/rules.ts --bundle --format=esm --outfile=/tmp/rules.mjs
          node scripts/check-mode-clock.mjs /tmp/i18n.mjs /tmp/rules.mjs
      # 侵蚀阶梯（§2）：段数合计＝全盘枚数、通式复算＝字面表、结转、基准 par。
      # 「合计对得上」是整套规则的地基——对不上就会出现「图案已经到 1 枚，盘上还剩
      # 几枚没翻」那种说不清的尾巴，而它不崩也不报错。
      - name: 侵蚀阶梯：段数与基准
        run: |
          npx esbuild src/engine/erosion.ts --bundle --format=esm --outfile=/tmp/erosion.mjs
          node scripts/check-erosion.mjs /tmp/erosion.mjs
      # 外边族消除（§3）：只削此刻最外面的那一条线。守两件真会出事的事——别从中间
      # 掏空（掏空会把穿过它的每条线截成两段，那副盘就再也滑不动了），以及三角形那
      # 三个一枚的尖角不许让棋盘缩不动。纯 node，不开浏览器。
      - name: 外边族消除：只削最外边
        run: |
          npx esbuild src/engine/outerEdge.ts --bundle --format=esm --outfile=/tmp/edge.mjs
          node scripts/check-line-clear.mjs /tmp/edge.mjs
      # 步数系数（§5）：下限 1 没有上限、按清掉的比例折算基准、一步没走不能变成
      # Infinity。外加一条「任意前缀 ≤ 打完」——它钉的是整套规则的方向：不能出现
      # 「早点退出更划算」。纯 node。
      - name: 步数系数与综合分
        run: |
          npx esbuild src/engine/stepCoef.ts --bundle --format=esm --outfile=/tmp/stepcoef.mjs
          node scripts/check-step-coef.mjs /tmp/stepcoef.mjs
      # 种子码（第 19 推）：编码再解码还原、任意一个字符抄错一律拦下、版本对不上说「已过期」、
      # 编号表只增不改、每日轮换（挨着两天不同玩法不同族）、北京零点换日——外加服务器那一份
      # （api/_seedcode.js）和这边前后八百天一个数都不差。两份走散了的后果是那一天每一局都被
      # 当成「伪造的每日」拒掉，今日榜上一个人都没有，而屏幕上不报任何错。纯 node。
      - name: 种子码：编码、校验、每日轮换、两份抄本
        run: |
          npx esbuild src/engine/seedCode.ts --bundle --format=esm --outfile=/tmp/seedcode.mjs
          node scripts/check-seed-code.mjs /tmp/seedcode.mjs
      # 每日挑战的今日榜（第 19 推）：服务器只收那一天、那一串码、那一个玩法；零点后宽限几分钟
      # 还收前一天的，过了算 late；被拒的那一局照样进存档和常规榜。直接叫 api/scores.js 的
      # handler、钟是手拨的，不起服务器。
      - name: 每日挑战的今日榜：伪造的每日一律不收
        run: node scripts/check-daily-push.mjs

  # 要开真浏览器的那一批。和上面那个 job 并行，所以它慢几分钟不拖累谁。
  #
  # **为什么先只收这几道**：都是最近真的拦下过回归的。
  #   · check-mode-axis  —— 主菜单那条鱼眼轴。第 9 节那五条断言是为「炸弹那张图被撑
  #     开」补的（玩家报过两轮、修好过一次、又回来过）。
  #   · check-menu       —— 换回鱼眼轴那天起它就一直崩在等 .mode-strip 上，**后面 39
  #     条一条都没跑过**，而整个进程还是 exit 0，看着像跑完了。
  #   · check-overlap    —— 同一族遗留；它还管「有没有东西永远够不着」。
  #   · check-board-fit  —— 棋子戳出底板（七色圆球余量为 0 那件事）。
  #
  # **为什么 xhs 那几道还没进来**：check-oldcss 现在有一条先前就存在的横屏红（横屏
  # 844×390 的主菜单走 .home-row 宽版排布，降级层那边盒子差 69px）。带着一条红进 CI，
  # 第一天就会被人加 `continue-on-error` 或者干脆关掉——那比不收更糟。等那一条修掉再收。
  #
  # **一个门一台服务器、一人一个端口**：CLAUDE.md 记着「兑换码在一个 dev-server 进程里
  # 只能用一次」。这四道都不兑码，但按同一条规矩摆，往后加要兑码的门不用回来改结构。
  # 关服务器不用 pkill -f（那会连 shell 一起杀掉）——job 跑完容器就没了。
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 六十多道开浏览器的门都写死 `executablePath: '/opt/pw-browsers/chromium'`
      # ——那是**开发容器里**的路径（CLAUDE.md 也是这么记的）。GitHub 的 runner 上
      # `playwright install` 装到 ~/.cache/ms-playwright/…，于是每一道门第一句就
      # `Failed to launch chromium because executable doesn't exist`，browser 这一条
      # **从建起来那天到 e2df336 一直整条红**：第一道门 1 秒就挂，后面二十来道全被
      # 跳过。跑不起来的门比没有门更坏——它看着像在守着，其实一行代码都没验过。
      #
      # 这儿把那个路径做出来，而不是去改那六十多个文件：那条路径在开发容器里是真的，
      # 改成「两处都认」要动六十三个文件，和这一推无关。等那一笔单独做（抽一个
      # scripts/pwChromium.mjs，六十三处 import 它）。
      - name: 把 chromium 摆到门写死的那个路径上
        run: |
          # 已经在那儿了（开发容器就是这样）就不动它。
          if [ ! -x /opt/pw-browsers/chromium ]; then
            real=$(node -e "console.log(require('playwright').chromium.executablePath())")
            test -x "$real" || { echo "::error::playwright 报的 chromium 不可执行：$real"; exit 1; }
            sudo mkdir -p /opt/pw-browsers
            sudo ln -sfn "$real" /opt/pw-browsers/chromium
            echo "/opt/pw-browsers/chromium -> $real"
          else
            echo "/opt/pw-browsers/chromium 本来就在"
          fi
          # 尺子：不止「链子建好了」，而是**真的启得动**。少了这一句，链子指到一个
          # 坏文件上也会「成功」，然后二十道门一起红，而红的话说的是别的事。
          node -e "const {chromium}=require('playwright');chromium.launch({executablePath:'/opt/pw-browsers/chromium'}).then(b=>b.close()).then(()=>console.log('起得动')).catch(e=>{console.error(e);process.exit(1)})"
      - name: 出一份产物（门读的是 dist）
        run: npm run build
      - name: 主菜单：鱼眼轴
        run: |
          # `nohup` + 把输出丢掉：不让这台服务器占着这一步的 stdout。占着的话，
          # 前台的门跑完了这一步也可能还在等它——本地试的时候就是这么挂住的。
          nohup node scripts/dev-server.mjs 8811 dist >/dev/null 2>&1 &
          # 等它真的起来再跑，不要盲等一个固定秒数：CI 的机器冷启动比本地慢，
          # 盲等出来的是偶发红，而偶发红最后一定会被人加 continue-on-error。
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8811/ && break; sleep 0.25; done
          node scripts/check-mode-axis.mjs http://localhost:8811/
      - name: 主菜单：摆了什么、什么次序、点一下开哪儿
        run: |
          # `nohup` + 把输出丢掉：不让这台服务器占着这一步的 stdout。占着的话，
          # 前台的门跑完了这一步也可能还在等它——本地试的时候就是这么挂住的。
          nohup node scripts/dev-server.mjs 8812 dist >/dev/null 2>&1 &
          # 等它真的起来再跑，不要盲等一个固定秒数：CI 的机器冷启动比本地慢，
          # 盲等出来的是偶发红，而偶发红最后一定会被人加 continue-on-error。
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8812/ && break; sleep 0.25; done
          node scripts/check-menu.mjs http://localhost:8812/
      - name: 有没有东西被压住、够不着
        run: |
          # `nohup` + 把输出丢掉：不让这台服务器占着这一步的 stdout。占着的话，
          # 前台的门跑完了这一步也可能还在等它——本地试的时候就是这么挂住的。
          nohup node scripts/dev-server.mjs 8813 dist >/dev/null 2>&1 &
          # 等它真的起来再跑，不要盲等一个固定秒数：CI 的机器冷启动比本地慢，
          # 盲等出来的是偶发红，而偶发红最后一定会被人加 continue-on-error。
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8813/ && break; sleep 0.25; done
          node scripts/check-overlap.mjs http://localhost:8813/
      - name: 棋子都在底板里
        run: |
          # `nohup` + 把输出丢掉：不让这台服务器占着这一步的 stdout。占着的话，
          # 前台的门跑完了这一步也可能还在等它——本地试的时候就是这么挂住的。
          nohup node scripts/dev-server.mjs 8814 dist >/dev/null 2>&1 &
          # 等它真的起来再跑，不要盲等一个固定秒数：CI 的机器冷启动比本地慢，
          # 盲等出来的是偶发红，而偶发红最后一定会被人加 continue-on-error。
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8814/ && break; sleep 0.25; done
          node scripts/check-board-fit.mjs http://localhost:8814/
      # 外边指引那条带子（§PR-7）：五副外边族画、方块 36 不画、在棋子**之下**、
      # 只动明度不动色相。它是这一版唯一一处「盘面现在什么样」的视觉提示，而它能
      # 坏的四种样子都不报错。一门一台服务器、一人一个端口。
      - name: 起服务器（外边指引）
        run: |
          nohup node scripts/dev-server.mjs 8819 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8819/ && break; sleep 0.5; done
      - name: 外边指引：双色托盘
        run: node scripts/check-edge-band.mjs http://localhost:8819/
      # 下面这三道，和上面四道是同一轮（1be498a）修好的——那一轮一口气修了五道
      # 崩在选择器上、崩了还 exit 0 的门，可只有 check-menu / check-overlap 两道进了
      # CI。另外三道为什么没进，当时没写；重新看过一遍，没有理由不收：都只要一台
      # dev-server、端口本来就各不相同，也都不带先前就存在的红（小红书那几道还是暂
      # 时不收，check-oldcss 带着一条横屏红，见那一轮的提交说明）。写法照上面四道：
      # nohup + 有界的 curl 就绪循环。
      - name: 天才特供那几页
        run: |
          nohup node scripts/dev-server.mjs 8815 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8815/ && break; sleep 0.25; done
          node scripts/check-perk-pages.mjs http://localhost:8815/
      # 新手拦截底下那颗《我会玩》：按下去立刻跳过引导，但**每个玩法头一回进去自带
      # 的教学照旧**。第二条最容易被顺手做掉（把跳过实现成「所有 firstTimeIn 都记成
      # 看过」就一次性把教学条也关了，不报错、不白屏，只是新人从此没人教）。
      # 只喂网页那一端：小红书那一半要先出预览页（npm run preview:xhs），那是另一
      # 条路，手跑的时候带上第三个参数就连着验。
      - name: 《我会玩》跳过引导，但不跳过教学
        run: |
          nohup node scripts/dev-server.mjs 8953 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8953/ && break; sleep 0.25; done
          node scripts/check-knowhow.mjs http://localhost:8953/
      # 教学那五条的配图（ui/ruleArt.ts）。要 Chromium，但**不要服务器**——它自己
      # setContent 一页出来，把 CSS 动画的时间轴拨到指定那一刻再量，几秒钟就完。
      #
      # 收它是因为这五幅图是玩家学规矩的地方，而它坏掉不报错：一段 CSS 动画照样跑
      # 得好好的，只是教的规矩是错的。2026-09 教学从六条改成五条，五幅图整体重排，
      # 下标错一个就会「第 3 条配上第 2 条那幅画」——屏幕上看不出是错位。
      - name: 教学五条的配图
        run: |
          npx esbuild src/ui/ruleArt.ts --bundle --format=esm --outfile=/tmp/ruleart.mjs
          node scripts/check-rule-art.mjs /tmp/ruleart.mjs
      # 暂停里那颗《怎么玩》：每个玩法只讲自己那一局的事，五条的用词和条数都钉死。
      # 它要兑一张 TESTMONTH，所以必须**一台自己的服务器**（一个 dev-server 进程里
      # 一张码只兑得动一次，两道门共用一台，后跑的那道会莫名其妙红）。
      - name: 《怎么玩》那一屏
        run: |
          nohup node scripts/dev-server.mjs 8941 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8941/ && break; sleep 0.25; done
          node scripts/check-howto.mjs http://localhost:8941/
      # 收单方审核会照着网站上的陈述逐条核——「网站陈述与实际不符」被直接归为 false
      # information，比缺一份文档严重。这一道就是那份自查：五张法务静态页、价格、
      # 订阅入口，按审核看得到的样子走一遍。
      - name: 收单方审核看得到的那几页
        run: |
          nohup node scripts/dev-server.mjs 8818 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8818/ && break; sleep 0.25; done
          node scripts/check-creem-review.mjs http://localhost:8818/
      # 老虎机这一条线（《侵蚀阶梯》v1.2 PR-8：一局只认**一个**得分目标）。
      #
      # 两道一起收，因为它们各守这条线的一半，而且都刚从「假绿」里捞出来：两道原先
      # 读的都是棋盘上方那条得分图示带，而 PR-7 把那条带子退役了——读到的是空集合，
      # 于是「盘上认的就是转出来的」变成「空等于空」，一直绿着。现在读的是 HUD 右边
      # 那一块《得分图案》，并且各带一条尺子（那一块必须真的画出了东西、必须挂着只有
      # 老虎机局才有的身份类），空过就红。
      #
      #   · check-random-target —— 单人那一条：挑图形 → 两个滚筒从左到右先后停在同一
      #     张上 → 倒数 → 开局，HUD 那一块画的必须正是轮子上停下来的那一个。
      #   · check-room-slot     —— 小屋那一条：《相同》全屋同一个图案，《不同》各转各
      #     的，而两档都要「每台设备认的正是它自己那台机器上停下来的那一个」。'own'
      #     全靠这一条：少了它，棋盘那边会用本机的 Math.random 再抽一次，玩家眼睁睁
      #     看着轮子停在 A、进去要凑的却是 B。
      #
      # **check-room-slot 必须一台自己的服务器**：它兑一张 TESTMONTH，而一个
      # dev-server 进程里一张码只兑得动一次（CLAUDE.md 那四个坑里的第一个）。
      - name: 老虎机：转出来的那一个真的到了盘上
        run: |
          nohup node scripts/dev-server.mjs 8861 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8861/ && break; sleep 0.25; done
          node scripts/check-random-target.mjs http://localhost:8861/
      - name: 老虎机：小屋里的《相同 / 不同》
        run: |
          nohup node scripts/dev-server.mjs 8862 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8862/ && break; sleep 0.25; done
          node scripts/check-room-slot.mjs http://localhost:8862/
      # 屋号那四格（PR-19 / E19）。四位打满是**直接进屋**的，没有《加入》那颗键——所以
      # 「我按下去了」这一下的回执只长在这四格上：还剩几位（空格的下横线）、下一下落在
      # 哪儿（闪烁的光标条）、打错了（抖 ＋ 每格一圈红）、打对了（每格一圈绿逐格画）。
      #
      # 收它是因为它当场拦下了一个「写了等于没写」：进屋那一下是 innerHTML 整片换掉，
      # 绿框如果不等它画完就换页，四圈和换页在**同一拍**里发生，一帧都画不出来——代码
      # 里明明有、屏幕上永远看不见，而且不报任何错。这道门在换页之前截一帧来量。
      #
      # **一台自己的服务器**：它开一间真屋（兑一张 TESTMONTH），而一个 dev-server 进程
      # 里一张码只兑得动一次。
      - name: 屋号四格：横线、光标、打错、打对
        run: |
          nohup node scripts/dev-server.mjs 8863 dist >/dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8863/ && break; sleep 0.25; done
          node scripts/check-room-code.mjs http://localhost:8863/
