<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Slides 发码</title>
<!--
  发码台。

  这个页面本身不是秘密，也不该被当成秘密——任何人都能打开它，就像任何人
  都能打开一扇锁着的门。管住门的是 ADMIN_TOKEN，而它在服务端校验，这里
  只是转交。

  令牌放在网址的 # 之后而不是 ? 之后，是因为 # 部分浏览器根本不会发给
  服务器：它不会出现在 Vercel 的访问日志里，也不会随 Referer 泄漏给任何
  第三方。把它收进书签，这一页就是你自己的工具。
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F1E4; --card: #FFFFFF; --ink: #2A2723; --soft: #6B645B;
    --line: #E2DACA; --accent: #B0454A; --ok: #2F7D4F;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1B1917; --card:#252220; --ink:#EDE7DA; --soft:#A69E92;
            --line:#3A3531; --accent:#D9787C; --ok:#6FBF8E; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 15px/1.55 -apple-system,
         BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
         padding: 24px 16px 64px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: var(--soft); margin: 0 0 22px; font-size: 0.9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          padding: 18px; margin-bottom: 16px; }
  label { display:block; font-weight:600; margin: 0 0 8px; font-size: 0.92rem; }
  .tiers { display:grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tier { border:1px solid var(--line); background:transparent; color:var(--ink);
          border-radius:11px; padding:11px 8px; font: inherit; cursor:pointer; text-align:center; }
  .tier[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
                               font-weight: 700; }
  .row { display:flex; gap:10px; align-items:flex-end; margin-top:16px; }
  .row > div { flex: 1; }
  input[type=number], input[type=password] {
    width:100%; font: inherit; padding:10px 12px; border-radius:11px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .check { display:flex; gap:9px; align-items:center; margin-top:16px; font-size:0.92rem; }
  .check input { width:18px; height:18px; accent-color: var(--accent); }
  button.go { width:100%; margin-top:18px; padding:14px; border:0; border-radius:13px;
              background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  button.go[disabled] { opacity:.55; cursor:default; }
  .msg { margin-top:12px; font-size:0.9rem; min-height:1.3em; }
  .msg.bad { color: var(--accent); }
  .msg.good { color: var(--ok); }
  .codes { background:var(--bg); border:1px solid var(--line); border-radius:11px;
           margin-top:14px; overflow:hidden; }
  .code-row { display:flex; align-items:center; gap:10px; padding:9px 10px 9px 14px; }
  .code-row + .code-row { border-top:1px solid var(--line); }
  .code-text { flex:1; font-family: var(--mono); font-size:1.05rem; letter-spacing:.09em;
               user-select:all; }
  .mini { flex:none; padding:6px 12px; border:1px solid var(--line); border-radius:9px;
          background:var(--card); color:var(--soft); font:inherit; font-size:0.82rem;
          cursor:pointer; min-width:64px; }
  .mini:hover { color:var(--ink); border-color:var(--soft); }
  .mini.done { color:var(--ok); border-color:var(--ok); }
  .copy { margin-top:10px; padding:10px 14px; border:1px solid var(--line); border-radius:11px;
          background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
  .warn { border-color: var(--accent); }
  .warn h2 { margin:0 0 6px; font-size:1rem; color:var(--accent); }
  code { font-family: var(--mono); background: var(--bg); padding: 1px 5px; border-radius:5px; }
</style>
</head>
<body>
<main>
  <h1>Slides 发码</h1>
  <p class="sub">生成「Slides 天才」内部码。仅供内部使用。</p>

  <div class="card warn" id="noToken" hidden>
    <h2>网址里没有令牌</h2>
    <p style="margin:0">在网址末尾加上 <code>#token=你的ADMIN_TOKEN</code> 再打开。<br>
    令牌放在 <code>#</code> 之后，浏览器就不会把它发给服务器，也不会留在日志里。</p>
  </div>

  <div class="card">
    <label>等级</label>
    <div class="tiers" id="tiers">
      <button class="tier" data-plan="month" aria-pressed="true">1 个月</button>
      <button class="tier" data-plan="half"  aria-pressed="false">半年</button>
      <button class="tier" data-plan="year"  aria-pressed="false">1 年</button>
      <button class="tier" data-plan="life"  aria-pressed="false">终身</button>
    </div>

    <div class="row">
      <div>
        <label for="count">数量（最多 200）</label>
        <input id="count" type="number" min="1" max="200" value="10" />
      </div>
      <div>
        <label for="days">几天内有效</label>
        <input id="days" type="number" min="1" max="3650" value="7" disabled />
      </div>
    </div>

    <div class="check">
      <input id="hasExpiry" type="checkbox" />
      <label for="hasExpiry" style="margin:0;font-weight:400">
        给玩家用：限期使用。<strong>不勾 = 永不过期</strong>，自己测试或当面给用这个。
      </label>
    </div>

    <button class="go" id="go">生成</button>
    <p class="msg" id="msg"></p>
  </div>

  <div class="card">
    <label>维护：重建榜单</label>
    <p style="margin:0 0 10px;color:var(--soft);font-size:0.9rem;line-height:1.5">
      照每个人自己的存档，把全部排行榜重算一遍。换过记分规则、或者要把某一种玩法
      从榜上清掉的时候用它。<strong>只动榜</strong>：玩家自己的存档、累计得分一个字不改。
    </p>
    <div class="check">
      <input id="dropFlip" type="checkbox" checked />
      <label for="dropFlip" style="margin:0;font-weight:400">
        顺手清空《无限反转》的旧榜（它早先那版计分打得出七位数，和现在不是一把尺子）
      </label>
    </div>
    <button class="go" id="rebuild">重建榜单</button>
    <p class="msg" id="rebuildMsg"></p>
  </div>

  <div class="card" id="out" hidden>
    <label id="outLabel"></label>
    <div class="codes" id="codes"></div>
    <button class="copy" id="copy">复制全部</button>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // The hash, not the query string: what follows # never leaves the browser.
  const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
  if (!token) $('noToken').hidden = false;

  let plan = 'month';
  for (const b of $('tiers').children) {
    b.addEventListener('click', () => {
      plan = b.dataset.plan;
      for (const o of $('tiers').children) o.setAttribute('aria-pressed', String(o === b));
    });
  }
  $('hasExpiry').addEventListener('change', (e) => { $('days').disabled = !e.target.checked; });

  const say = (text, kind) => { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); };
  const PLAN_CN = { month: '1 个月', half: '半年', year: '1 年', life: '终身' };
  const ERRORS = {
    wrong: '令牌不对。检查网址 # 后面那串。',
    notConfigured: '服务端还没有连上存储（Redis），或者还没部署。',
    plan: '等级不对。',
    method: '请求方式不对。',
  };

  $('go').addEventListener('click', async () => {
    if (!token) return say('网址里没有令牌，见上面。', 'bad');
    const count = Math.max(1, Math.min(200, Number($('count').value) || 1));
    const body = { token, plan, count };
    if ($('hasExpiry').checked) body.expiresInDays = Math.max(1, Number($('days').value) || 7);

    $('go').disabled = true;
    say('正在生成…');
    try {
      const res = await fetch('/api/mint', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const reply = await res.json().catch(() => ({}));
      $('go').disabled = false;
      if (!res.ok) return say(ERRORS[reply.error] || ('出错了：HTTP ' + res.status), 'bad');

      renderCodes(reply.codes);
      const until = reply.expiresAt
        ? '，' + new Date(reply.expiresAt).toLocaleString() + ' 前有效'
        : '，永不过期';
      $('outLabel').textContent = `${PLAN_CN[reply.plan] || reply.plan} × ${reply.count}${until}`;
      $('out').hidden = false;
      say(`生成了 ${reply.count} 个。`, 'good');
    } catch {
      $('go').disabled = false;
      say('连不上服务器。', 'bad');
    }
  });

  // ---- 维护：重建榜单 ----------------------------------------------------
  $('rebuild').addEventListener('click', async () => {
    const sayR = (t, kind) => {
      $('rebuildMsg').textContent = t;
      $('rebuildMsg').className = 'msg ' + (kind || '');
    };
    if (!token) return sayR('网址里没有令牌，见上面。', 'bad');
    $('rebuild').disabled = true;
    sayR('正在重算…（人多的话要等十几秒）');
    try {
      const res = await fetch('/api/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'rebuild',
          token,
          drop: $('dropFlip').checked ? ['flip'] : [],
        }),
      });
      const reply = await res.json().catch(() => ({}));
      $('rebuild').disabled = false;
      if (!res.ok) return sayR(ERRORS[reply.error] || ('出错了：HTTP ' + res.status), 'bad');
      const dropped = (reply.dropped || []).length ? '，清掉了 ' + reply.dropped.join('、') : '';
      sayR(`重算完了：${reply.players} 个人，写了 ${reply.rows} 行${dropped}。`, 'good');
    } catch {
      $('rebuild').disabled = false;
      sayR('连不上服务器。', 'bad');
    }
  });

  /**
   * Copying, and what to do when the browser will not.
   *
   * The clipboard API refuses on an insecure origin and in a few browsers
   * that want a real selection first. Selecting the text is not the same as
   * copying it, but it is one keystroke away and it is honest — far better
   * than a button that says 已复制 over an empty clipboard.
   */
  async function copyText(text, node, btn, restore) {
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = '已复制';
    } catch {
      const r = document.createRange();
      r.selectNodeContents(node);
      getSelection().removeAllRanges();
      getSelection().addRange(r);
      btn.textContent = '已选中';
    }
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = restore; btn.classList.remove('done'); }, 2200);
  }

  // One row per code, each with its own button: handing out four codes to
  // four people means copying them one at a time, and picking a single line
  // out of a block by hand is exactly where a character goes missing.
  let lastCodes = [];
  function renderCodes(codes) {
    lastCodes = codes;
    $('codes').replaceChildren(...codes.map((code) => {
      const row = document.createElement('div');
      row.className = 'code-row';
      const text = document.createElement('span');
      text.className = 'code-text';
      text.textContent = code;
      const btn = document.createElement('button');
      btn.className = 'mini';
      btn.textContent = '复制';
      btn.addEventListener('click', () => copyText(code, text, btn, '复制'));
      row.append(text, btn);
      return row;
    }));
  }

  $('copy').addEventListener('click', () =>
    copyText(lastCodes.join('\n'), $('codes'), $('copy'), '复制全部'),
  );
})();
</script>
</body>
</html>
